# Render Blueprint: the free web service that serves BiteCast (render.com, no card needed).
# The cached cities in data/ ship with the code; places searched later are fetched live. Render's free disk
# resets on every deploy or restart, so those later places are fetched again after one. Bite reports live in
# Postgres (DATABASE_URL), so they survive.
services:
  - type: web
    name: bitecast
    runtime: python
    plan: free
    region: singapore        # next to the Neon database
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/cities
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DATABASE_URL        # the Neon connection string: paste it in Render, never commit it
        sync: false
