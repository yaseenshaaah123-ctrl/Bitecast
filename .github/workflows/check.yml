# Runs every self-check, the API smoke test, the cross-city go/no-go and the real-records comparison.
# Offline apart from pip: the weather, OSM and GBIF data it needs are committed in data/.
name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt httpx
      - run: python check.py
